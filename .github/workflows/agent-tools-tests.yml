name: Agent Tools (TS) Tests

on:
  push:
    branches: [main]
    paths:
      - "galaxy-agent-tools/**"
      - ".github/workflows/agent-tools-tests.yml"
      # The TS parity check reads the Python server's generated surface manifest, so a
      # change to it has to run this workflow or a new gap lands unnoticed.
      - "mcp-server-galaxy-py/tests/testdata/mcp-surface.json"
      # The report is generated from both surfaces, so an edit to it alone is still
      # something the check has to have an opinion about.
      - "PARITY.md"
  pull_request:
    branches: [main]
    paths:
      - "galaxy-agent-tools/**"
      - ".github/workflows/agent-tools-tests.yml"
      # The TS parity check reads the Python server's generated surface manifest, so a
      # change to it has to run this workflow or a new gap lands unnoticed.
      - "mcp-server-galaxy-py/tests/testdata/mcp-surface.json"
      # The report is generated from both surfaces, so an edit to it alone is still
      # something the check has to have an opinion about.
      - "PARITY.md"
  workflow_dispatch:

defaults:
  run:
    working-directory: galaxy-agent-tools

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: galaxy-agent-tools/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: galaxy-agent-tools/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Boundary lint (dependency-cruiser)
        run: pnpm depcruise

      - name: Build
        run: pnpm -r build

      # Generated here rather than read off the checked-in copy, so the summary says
      # what the code says. Last, and whether or not the gates above passed: a report
      # that cannot be built must not be what skips them, and a failing parity check is
      # exactly when somebody wants the table in front of them.
      - name: Parity report
        if: ${{ !cancelled() }}
        run: pnpm --silent parity:report:print >> "$GITHUB_STEP_SUMMARY"
