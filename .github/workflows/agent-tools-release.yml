name: Agent Tools (TS) Release

# Stages the @galaxyproject/galaxy-{ops,cli,mcp} packages on npm for a maintainer to
# approve. Trigger by pushing a tag like `ts-v0.1.0` (or run manually). Auth is via npm
# trusted publishing (OIDC) -- no NPM_TOKEN. Each package has a trusted publisher
# configured on npmjs.com (org: galaxyproject, repo: galaxy-mcp, workflow filename:
# agent-tools-release.yml) that may only stage, not publish directly, so nothing goes
# live until a maintainer approves it with 2FA: on npmjs.com, or `npm stage list` then
# `npm stage approve <stage-id>`. Approve galaxy-ops first; the other two depend on it.

on:
  push:
    tags:
      - "ts-v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing (and provenance)

defaults:
  run:
    working-directory: typescript

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: typescript/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Build
        run: pnpm -r build

      # Trusted publishing (OIDC), no NPM_TOKEN: pnpm packs each package -- which
      # rewrites `workspace:*` to the concrete version inside the tarball -- then npm
      # does the OIDC-authenticated upload. It stages rather than publishes: the
      # trusted publishers are configured stage-only, so a pushed tag alone can't put
      # a version on npm. We use npm, not pnpm, because pnpm's OIDC support is not yet
      # reliable and pnpm has no staging. galaxy-ops goes first to match approval order.
      - name: Stage on npm (trusted publishing)
        run: |
          set -euo pipefail
          npm install -g npm@latest   # OIDC needs npm >= 11.5.1; `npm stage` is newer still
          for pkg in galaxy-ops galaxy-cli galaxy-mcp; do
            tgz="$(cd "packages/$pkg" && pnpm pack --pack-destination "$RUNNER_TEMP" | tail -1)"
            echo "Staging $tgz"
            npm stage publish "$tgz" --access public
          done
